<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <caption>Exercicio Curso em Video</caption>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Media</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th> 
                <td>Matematica</td>
                <td class="tt">0.0</td>
                <td class="tt">0.0</td>
                <td class="tt">0.0</td>
            </tr>
            <tr>
                <td>fisica</td>
                <td class="tt">0.0</td>
                <td class="tt">0.0</td>
                <td class="tt">0.0</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td class="tt">0.0</td>
                <td class="tt">0.0</td>
                <td class="tt">0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="tt">0.0</td>
                <td class="tt">0.0</td>
                <td class="tt">0.0</td>
            </tr>
            <tr>
                <th colspan="4" id="md" scope="row">Media de Exatas</th>
                <td id="md" class="tt">0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>Historia</td>
                <td class="tt">0.0</td>
                <td class="tt">0.0</td>
                <td class="tt">0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="tt">0.0</td>
                <td class="tt">0.0</td>
                <td class="tt">0.0</td>
            </tr>
            <tr>
                <th colspan="4" id="md" scope="row">Media de Humanas</th>
                <td id="md" class="tt">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
