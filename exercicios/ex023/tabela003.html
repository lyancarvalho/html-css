<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(35, 35, 35);
            color: white;
        }

        table {
            border-collapse: collapse;
            width: 300px;
        }

        td {
            border: 1px black solid;
            padding: 10px;
            text-align: center;
        }

    </style>
</head>
<body>
    <h1>Mesclagem de celulas</h1>

    <!--
        colspan = ocupação de colunas (lados)
        rowspan = ocupação de linhas (cima/baixo)
    -->
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
            
        </tr>
        <tr>
            <td rowspan="3">D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td colspan="2">L</td>
        </tr>

    </table>
</body>
</html>
