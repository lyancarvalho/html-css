<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 
        HIERARQUIA DE TABELAS
            -> Table = Tabela
            -> Table row = linhas de tabela
                -> Table header =  cabeçalho
                -> Table data = dado de tabela~

        */

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(39, 39, 39);
            color: rgb(179, 179, 179);
        }

        table {
            height: 400px;
            width: 400px;
            border-collapse: collapse;
        }

        td {
            border: 1px black solid;
            padding: 7px;
            text-align: center;
            vertical-align: middle;
        } 
    </style>

</head>

<body>
    <h1>Minha primeira tabela</h1>
    
    <table>
        <tr> <!-- Primeira linha -->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>

        <tr> <!-- Segunda linha -->
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>
        </tr>

        <tr> <!-- Terceira linha -->
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>

        <tr> <!-- Quarta linha -->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
